###############################################################################
#
# Mosquitto for Home Assistant. Port 1883 is for LAN devices.
# The entrypoint manages MQTT_USER and MQTT_HA_USER in the password file.
# Passwords are not placed on the container command line.
# The healthcheck authenticates only the Zigbee2MQTT account.
# It uses an options file, so the password is not a client argument.
# post-deploy.sh authenticates both accounts.
#
###############################################################################

services:
  mosquitto:
    image: ${MOSQUITTO_IMAGE:?MOSQUITTO_IMAGE}
    container_name: ha-mosquitto
    hostname: ha-mosquitto
    user: "0:0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_HA_USER: ${MQTT_HA_USER}
      MQTT_HA_PASSWORD: ${MQTT_HA_PASSWORD}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/ha-entrypoint.sh
    ports:
      # LAN devices such as LilyGO. Not a route from the VPS.
      - "1883:1883"
    volumes:
      - ../configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../configs/mosquitto/entrypoint.sh:/usr/local/bin/ha-entrypoint.sh:ro
      - ../configs/mosquitto/healthcheck.sh:/usr/local/bin/ha-mosquitto-healthcheck.sh:ro
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
      - ${DATA_DIR}/mosquitto/auth:/mosquitto/config/auth
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/ha-mosquitto-healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ha-internal
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILES}"
